<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mr5am</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #0b1410; color: #f0ece4; scroll-behavior: smooth; }
    body { overflow-x: hidden; font-family: 'Space Mono', monospace; }
    #root { position: relative; z-index: 1; }
    ::selection { background: #c9923a; color: #000; }
    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-track { background: #0b1410; }
    ::-webkit-scrollbar-thumb { background: var(--acc, #c9923a); }

    /* ── Ken Burns animations ──────────────────────────────────────────── */
    @keyframes kb0 { 0%{transform:scale(1)   translate(0%,0%)}   100%{transform:scale(1.12) translate(-2%,-1%)} }
    @keyframes kb1 { 0%{transform:scale(1.1)  translate(1.5%,0%)} 100%{transform:scale(1)    translate(-1%,2%)}  }
    @keyframes kb2 { 0%{transform:scale(1)    translate(2%,1%)}   100%{transform:scale(1.14) translate(-1%,-2%)} }
    @keyframes kb3 { 0%{transform:scale(1.08) translate(-1%,2%)}  100%{transform:scale(1)    translate(2%,-1%)}  }
    @keyframes kb4 { 0%{transform:scale(1)    translate(0%,2%)}   100%{transform:scale(1.1)  translate(-2%,-2%)} }
    @keyframes kb5 { 0%{transform:scale(1.06) translate(-2%,-1%)} 100%{transform:scale(1)    translate(1%,2%)}   }

    /* ── Glitch layers ───────────────────────────────────────────────── */
    .gl { position: relative; display: inline-block; }
    .gl::before, .gl::after {
      content: attr(data-t); position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; font: inherit; pointer-events: none;
    }
    .gl::before { color: var(--acc, #c9923a); animation: gl1 7s infinite; clip-path: inset(0 0 100% 0); }
    .gl::after  { color: var(--acc2,#7ecfa0); animation: gl2 7s infinite; clip-path: inset(0 0 100% 0); }
    @keyframes gl1 {
      0%,89%,100%{clip-path:inset(0 0 100% 0);transform:translate(0)}
      90%{clip-path:inset(20% 0 42% 0);transform:translate(-7px,2px)}
      91%{clip-path:inset(58% 0 14% 0);transform:translate(7px,-2px)}
      92%{clip-path:inset(0 0 100% 0);transform:translate(0)}
    }
    @keyframes gl2 {
      0%,84%,100%{clip-path:inset(0 0 100% 0);transform:translate(0)}
      85%{clip-path:inset(44% 0 28% 0);transform:translate(7px,-2px)}
      86%{clip-path:inset(0 0 100% 0);transform:translate(0)}
    }

    /* ── Scroll reveal ───────────────────────────────────────────────── */
    .rv { opacity:0; transform:translateY(40px); transition:opacity .9s ease,transform .9s cubic-bezier(.22,1,.36,1); }
    .rv.in { opacity:1; transform:translateY(0); }

    /* ── Horizontal scroll ───────────────────────────────────────────── */
    .hscroll { display:flex; overflow-x:auto; gap:14px; padding:0 32px 20px; scroll-snap-type:x mandatory; scrollbar-width:thin; scrollbar-color:var(--acc,#c9923a) transparent; }
    .hscroll::-webkit-scrollbar { height:2px; }
    .hscroll::-webkit-scrollbar-thumb { background:var(--acc,#c9923a); }

    /* ── Marquee ─────────────────────────────────────────────────────── */
    @keyframes mq { from{transform:translateX(0)} to{transform:translateX(-50%)} }

    /* ── Spin ────────────────────────────────────────────────────────── */
    @keyframes spin  { from{transform:rotate(0deg)}   to{transform:rotate(360deg)}  }
    @keyframes spinr { from{transform:rotate(0deg)}   to{transform:rotate(-360deg)} }

    /* ── Tweaks panel ────────────────────────────────────────────────── */
    .tp { position:fixed; bottom:24px; right:24px; z-index:9999; background:#0d150e; border-radius:4px; padding:20px; width:264px; font-family:'Space Mono',monospace; font-size:11px; box-shadow:0 20px 60px #000a; }
    .tp label { display:block; color:#4a5a4d; font-size:9px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:5px; margin-top:12px; }
    .tp input[type=text] { width:100%; background:#111; border:1px solid #1e2a20; color:#f0ece4; padding:6px 8px; font-family:'Space Mono',monospace; font-size:11px; border-radius:2px; }
    .tp .chips { display:flex; gap:6px; flex-wrap:wrap; }
    .tp .chip { padding:5px 10px; border-radius:2px; border:1px solid #1e2a20; cursor:pointer; color:#4a5a4d; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.1em; transition:all .2s; background:transparent; }
    .tp .chip.on { border-color:var(--acc,#c9923a); background:color-mix(in srgb,var(--acc,#c9923a) 16%,transparent); color:var(--acc,#c9923a); }
  </style>
</head>
<body>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

  'assets/image/mr5am_A_painterly_anime_illustration_style_reminiscent_of_Stu_3eaab53c-c771-4d6c-8333-e797aa8bc109_2.png',
  'assets/image/mr5am_A_painterly_anime_illustration_style_reminiscent_of_Stu_9c58bc0e-17e6-4210-86e1-5b6eaccb3a08_2.png',
  'assets/image/mr5am_Dual_scenery_above_and_below_the_water_surface._Above_t_ed2ed109-eb7d-479b-8f01-c558e15189da_2.png',
  'assets/image/mr5am_A_painterly_anime_illustration_style_reminiscent_of_Stu_347cd1e8-cbeb-4074-9730-834b0a65c0ec_3.png',
  'assets/image/mr5am_A_painterly_anime_illustration_style_reminiscent_of_Stu_9c58bc0e-17e6-4210-86e1-5b6eaccb3a08_3.png',

const MODES = {

  azure:  { label:'AZURE',  bg:'#080f1c', acc:'#5ab8d4', acc2:'#f0c860', rgb:[90,184,212]  },
  lotus:  { label:'LOTUS',  bg:'#060d0b', acc:'#4ecba8', acc2:'#e8a4b8', rgb:[78,203,168]  },

const WORKS_RAW = [

  { id:2, title:'Below & Above',       type:'Generative Art',  year:'2025', tag:'ART',   jp:'水面',     img:ART_IMGS[3] },
  { id:3, title:'Threshold',           type:'Anime Short',     year:'2024', tag:'VIDEO', jp:'閾値',     img:ART_IMGS[4] },
  { id:4, title:'Azure City',          type:'Generative Art',  year:'2024', tag:'ART',   jp:'蒼天',     img:ART_IMGS[1] },

];
const WORKS = [...WORKS_RAW].sort((a,b) =>
  Math.sin(VISIT_SEED*a.id*9301+49297) - Math.sin(VISIT_SEED*b.id*9301+49297)
);

const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "name": "mr5am",
  "tagline": "generative art · anime · music · games",
  "mode": "forest"
}/*EDITMODE-END*/;

/* ── useReveal ───────────────────────────────────────────────────────────── */
function useReveal(margin = '-60px') {
  const ref = useRef();
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { el.classList.add('in'); obs.disconnect(); }
    }, { rootMargin: margin });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}

/* ── Artwork Slideshow BG ────────────────────────────────────────────────── */
function ArtworkSlideshowBG({ mode }) {
  const cfg = MODES[mode];
  const startIdx = VISIT_SEED % ART_IMGS.length;
  const [active, setActive] = useState(0);
  const [slots, setSlots] = useState([
    { img: startIdx, animKey: 0 },
    { img: (startIdx + 1) % ART_IMGS.length, animKey: 1 },
  ]);
  const nextRef = useRef((startIdx + 2) % ART_IMGS.length);

  useEffect(() => {
    const iv = setInterval(() => {
      const incoming = (active + 1) % 2;
      const newImg = nextRef.current;
      nextRef.current = (newImg + 1) % ART_IMGS.length;
      setSlots(s => s.map((sl, i) =>
        i === incoming ? { img: newImg, animKey: sl.animKey + 2 } : sl
      ));
      setActive(incoming);
    }, 9000);
    return () => clearInterval(iv);
  }, [active]);

  return (
    <div style={{ position:'fixed', inset:0, zIndex:0, overflow:'hidden', background:'#000' }}>
      {slots.map((sl, i) => (
        <div key={sl.animKey} style={{
          position:'absolute', inset:0,
          opacity: i === active ? 1 : 0,
          transition:'opacity 2.4s ease',
          zIndex: i === active ? 2 : 1,
        }}>
          <img
            src={ART_IMGS[sl.img]} alt=""
            style={{
              width:'100%', height:'100%', objectFit:'cover', display:'block',
              transformOrigin:'center center',
              animation:`kb${sl.img % 6} 18s ease-in-out both`,
            }}
          />
        </div>
      ))}
      {/* Overlays — darken for readability */}
      <div style={{ position:'absolute', inset:0, zIndex:3, background:'rgba(0,0,0,0.46)' }} />
      <div style={{ position:'absolute', inset:0, zIndex:4,
        background:'linear-gradient(180deg, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0.05) 35%, rgba(0,0,0,0.5) 80%, rgba(0,0,0,0.85) 100%)' }} />
      {/* Subtle color tint from current mode */}
      <div style={{ position:'absolute', inset:0, zIndex:5,
        background:`radial-gradient(ellipse 80% 60% at 70% 40%, ${cfg.acc}12, transparent 65%)`,
        transition:'background 1.5s ease', pointerEvents:'none' }} />
    </div>
  );
}

/* ── Firefly Canvas ──────────────────────────────────────────────────────── */
function FireflyCanvas({ mode }) {
  const ref = useRef();
  const rafRef = useRef();
  const modeRef = useRef(mode);
  useEffect(() => { modeRef.current = mode; }, [mode]);

  useEffect(() => {
    const canvas = ref.current;
    const ctx = canvas.getContext('2d');
    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;
    const onResize = () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; };
    window.addEventListener('resize', onResize);

    // Fireflies — slow, organic, breathing
    const N = 38 + Math.floor(Math.sin(VISIT_SEED) * 8 + 8);
    const flies = Array.from({ length: N }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.22,
      vy: -(Math.random() * 0.18 + 0.04), // slow upward drift
      r: Math.random() * 2.2 + 0.8,
      phase: Math.random() * Math.PI * 2,
      freq: Math.random() * 0.4 + 0.2,
      size: Math.random() * 14 + 6, // glow radius
    }));

    let t = 0;
    const draw = () => {
      t += 0.012;
      ctx.clearRect(0, 0, W, H);
      const cfg = MODES[modeRef.current];
      const [pr, pg, pb] = cfg.rgb;

      flies.forEach(f => {
        // Drift with gentle wander
        f.x += f.vx + Math.sin(t * 0.3 + f.phase) * 0.08;
        f.y += f.vy + Math.cos(t * 0.25 + f.phase * 1.3) * 0.06;
        f.vx += (Math.random() - 0.5) * 0.008;
        f.vy += (Math.random() - 0.5) * 0.006;
        f.vx *= 0.996; f.vy *= 0.996;
        // Gentle wrap
        if (f.x < -40) f.x = W + 40;
        if (f.x > W + 40) f.x = -40;
        if (f.y < -80) f.y = H + 40;
        if (f.y > H + 40) f.y = -20;

        // Breathing opacity
        const alpha = (Math.sin(t * f.freq + f.phase) * 0.5 + 0.5) * 0.6 + 0.08;

        // Outer glow — soft and large
        const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size * 2);
        g.addColorStop(0, `rgba(${pr},${pg},${pb},${alpha * 0.55})`);
        g.addColorStop(0.4, `rgba(${pr},${pg},${pb},${alpha * 0.2})`);
        g.addColorStop(1, `rgba(${pr},${pg},${pb},0)`);
        ctx.beginPath(); ctx.fillStyle = g;
        ctx.arc(f.x, f.y, f.size * 2, 0, Math.PI * 2); ctx.fill();

        // Bright core
        const g2 = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 1.8);
        g2.addColorStop(0, `rgba(255,255,240,${alpha * 0.95})`);
        g2.addColorStop(1, `rgba(${pr},${pg},${pb},0)`);
        ctx.beginPath(); ctx.fillStyle = g2;
        ctx.arc(f.x, f.y, f.r * 1.8, 0, Math.PI * 2); ctx.fill();
      });

      rafRef.current = requestAnimationFrame(draw);
    };
    draw();
    return () => { window.removeEventListener('resize', onResize); cancelAnimationFrame(rafRef.current); };
  }, []);

  return <canvas ref={ref} style={{ position:'fixed', inset:0, zIndex:6, pointerEvents:'none' }} />;
}

/* ── Nav ─────────────────────────────────────────────────────────────────── */
function Nav({ name, mode, setMode }) {
  const cfg = MODES[mode];
  const [sc, setSc] = useState(false);
  useEffect(() => {
    const fn = () => setSc(window.scrollY > 50);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);
  return (
    <nav style={{
      position:'fixed', top:0, left:0, right:0, zIndex:100,
      padding:'14px 32px', display:'flex', alignItems:'center', justifyContent:'space-between',
      background: sc ? `${cfg.bg}f0` : 'transparent',
      backdropFilter: sc ? 'blur(14px)' : 'none',
      borderBottom:`1px solid ${sc ? cfg.acc+'28' : 'transparent'}`,
      transition:'all .4s',
    }}>
      <span style={{ fontFamily:'Space Mono', fontSize:11, color:cfg.acc, letterSpacing:'.14em' }}>
        {name}<span style={{ color:'rgba(255,255,255,0.2)' }}> / {new Date().getFullYear()}</span>
      </span>
      <div style={{ display:'flex', gap:6 }}>
        {Object.entries(MODES).map(([k,m]) => (
          <button key={k} onClick={() => setMode(k)} style={{
            fontFamily:'Space Mono', fontSize:9, letterSpacing:'.12em', padding:'4px 11px',
            borderRadius:2, cursor:'pointer', transition:'all .2s',
            border:`1px solid ${mode===k ? m.acc : 'rgba(255,255,255,0.08)'}`,
            background: mode===k ? m.acc+'28' : 'transparent',
            color: mode===k ? m.acc : 'rgba(255,255,255,0.25)',
          }}>{m.label}</button>
        ))}
      </div>
      <div style={{ display:'flex', gap:28 }}>
        {['work','about','contact'].map(s => (
          <a key={s} href={`#${s}`} style={{
            fontFamily:'Space Mono', fontSize:9, letterSpacing:'.14em', textTransform:'uppercase',
            color:'rgba(255,255,255,0.3)', textDecoration:'none', transition:'color .2s',
          }}
          onMouseEnter={e => e.target.style.color = cfg.acc}
          onMouseLeave={e => e.target.style.color = 'rgba(255,255,255,0.3)'}
          >{s}</a>
        ))}
      </div>
    </nav>
  );
}

/* ── Hero ────────────────────────────────────────────────────────────────── */
function Hero({ name, mode }) {

        <div style={{ position:'absolute', top:'50%', left:0, right:0, height:1, background:`linear-gradient(90deg,transparent,${cfg.acc}50,transparent)` }} />
        <div style={{ position:'absolute', left:'50%', top:0, bottom:0, width:1, background:`linear-gradient(180deg,transparent,${cfg.acc}50,transparent)` }} />
        <div style={{ position:'absolute', top:4, left:'50%', marginLeft:-4, width:8, height:8, background:cfg.acc, borderRadius:'50%', boxShadow:`0 0 10px ${cfg.acc}, 0 0 20px ${cfg.acc}66` }} />
      </div>

      {/* JP accent */}
      <div style={{ position:'absolute', top:88, right:32, textAlign:'right', opacity: vis ? 1 : 0, transition:'opacity 1.4s ease 2s', pointerEvents:'none' }}>

      {/* Visit ID */}
      <div style={{ position:'absolute', top:90, left:32, opacity: vis ? 0.4 : 0, transition:'opacity 1s ease 2.2s' }}>

      <div style={{ position:'relative', zIndex:7 }}>

          ✦ PORTFOLIO · {new Date().getFullYear()} ✦

        <h1 style={{ fontFamily:'Bebas Neue', fontSize:'clamp(88px,14vw,224px)', lineHeight:.88, letterSpacing:'.02em', ...tr(.1) }}>
          <span className="gl" data-t={name.toUpperCase()}>{name.toUpperCase()}</span>
        </h1>

        {/* Discipline cycler */}
        <div style={{ marginTop:30, display:'flex', alignItems:'center', gap:16, ...tr(.45) }}>
          <div style={{ width:36, height:1, background:`linear-gradient(90deg,${cfg.acc},transparent)` }} />

            {discs[discIdx]}

          <div style={{ display:'flex', gap:4 }}>
            {discs.map((_,i) => (
              <div key={i} style={{ width:i===discIdx?18:4, height:2, background:i===discIdx?cfg.acc:'rgba(255,255,255,0.15)', borderRadius:1, transition:'all .35s' }} />
            ))}
          </div>
        </div>

        {/* Scroll indicator */}
        <div style={{ marginTop:52, display:'flex', alignItems:'center', gap:12, opacity: vis ? .45 : 0, transition:'opacity 1.2s ease 1.6s' }}>
          <div style={{ width:1, height:44, background:`linear-gradient(${cfg.acc},transparent)` }} />
          <span style={{ fontFamily:'Space Mono', fontSize:9, color:'rgba(255,255,255,0.4)', letterSpacing:'.2em', textTransform:'uppercase' }}>scroll</span>
        </div>
      </div>

      {/* Marquee */}
      <div style={{ position:'absolute', bottom:0, left:0, right:0, borderTop:`1px solid rgba(255,255,255,0.06)`, overflow:'hidden', padding:'10px 0', opacity: vis ? 1 : 0, transition:'opacity 1.5s ease 1.8s', zIndex:7 }}>
        <div style={{ display:'flex', whiteSpace:'nowrap', animation:'mq 22s linear infinite', width:'max-content' }}>
          {[...Array(10)].map((_,i) => (
            <span key={i} style={{ fontFamily:'Space Mono', fontSize:10, color:'rgba(255,255,255,0.14)', letterSpacing:'.2em', textTransform:'uppercase', padding:'0 28px' }}>

            </span>
          ))}
        </div>
      </div>
    </section>

/* ── Tweaks Panel ────────────────────────────────────────────────────────── */
function TweaksPanel({ visible, tweaks, setTweaks, mode, setMode }) {
  if (!visible) return null;
  const cfg = MODES[mode];
  const upd = (k,v) => {
    setTweaks(t => ({ ...t, [k]:v }));
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ [k]:v } }, '*');
  };
  return (
    <div className="tp" style={{ border:`1px solid ${cfg.acc}33`, boxShadow:`0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px ${cfg.acc}18` }}>
      <div style={{ fontFamily:'Bebas Neue', fontSize:14, color:cfg.acc, letterSpacing:'.1em' }}>TWEAKS</div>
      <label>Name / Handle</label>
      <input type="text" value={tweaks.name} onChange={e => upd('name', e.target.value)} />
      <label>Tagline</label>
      <input type="text" value={tweaks.tagline} onChange={e => upd('tagline', e.target.value)} />
      <label>Visual Mode</label>
      <div className="chips">
        {Object.entries(MODES).map(([k,m]) => (
          <button key={k} className={`chip${mode===k?' on':''}`}
            onClick={() => { setMode(k); upd('mode',k); }}>{m.label}</button>
        ))}
      </div>
    </div>
  );
}

/* ── App ─────────────────────────────────────────────────────────────────── */
function App() {
  const [tweaks, setTweaks] = useState(TWEAKS_DEFAULTS);
  const [mode, setMode] = useState(TWEAKS_DEFAULTS.mode || 'forest');
  const [tweaksOn, setTweaksOn] = useState(false);

  useEffect(() => {
    const handler = e => {
      if (e.data?.type === '__activate_edit_mode')   setTweaksOn(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOn(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  useEffect(() => {
    const cfg = MODES[mode];
    document.documentElement.style.setProperty('--acc', cfg.acc);
    document.documentElement.style.setProperty('--acc2', cfg.acc2);
    document.documentElement.style.setProperty('--bg', cfg.bg);
    document.body.style.background = cfg.bg;
    document.documentElement.style.background = cfg.bg;
  }, [mode]);

  const { name, tagline } = tweaks;

  return (
    <>
      {/* Fixed background layers */}
      <ArtworkSlideshowBG mode={mode} />
      <FireflyCanvas mode={mode} />

      {/* Foreground content */}
      <div style={{ position:'relative', zIndex:7 }}>
        <Nav name={name} mode={mode} setMode={setMode} />
        <Hero name={name} mode={mode} />
      </div>

      {/* Solid-bg content sections */}
      <ContentBG mode={mode}>
        <WorksSection mode={mode} />
        <AboutSection name={name} mode={mode} />
        <ProcessSection mode={mode} />
        <ExperimentsSection mode={mode} />
        <ContactSection name={name} mode={mode} />
        <Footer name={name} mode={mode} />
      </ContentBG>

      <TweaksPanel visible={tweaksOn} tweaks={tweaks} setTweaks={setTweaks} mode={mode} setMode={setMode} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
