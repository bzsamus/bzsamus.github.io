<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mr5am</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; font-family: 'Space Mono', monospace; }
    #root { position: relative; z-index: 1; }
    ::selection { background: var(--acc, #c9923a); color: #000; }
    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-track { background: var(--bg, #0b1410); }
    ::-webkit-scrollbar-thumb { background: var(--acc, #c9923a); }

    /* ── Ken Burns ─────────────────────────────────────────────────────── */
    @keyframes kb0 { 0%{transform:scale(1)    translate(0%,0%)}    100%{transform:scale(1.12) translate(-2%,-1%)} }
    @keyframes kb1 { 0%{transform:scale(1.1)  translate(1.5%,0%)}  100%{transform:scale(1)    translate(-1%,2%)}  }
    @keyframes kb2 { 0%{transform:scale(1)    translate(2%,1%)}    100%{transform:scale(1.14) translate(-1%,-2%)} }
    @keyframes kb3 { 0%{transform:scale(1.08) translate(-1%,2%)}   100%{transform:scale(1)    translate(2%,-1%)}  }
    @keyframes kb4 { 0%{transform:scale(1)    translate(0%,2%)}    100%{transform:scale(1.1)  translate(-2%,-2%)} }
    @keyframes kb5 { 0%{transform:scale(1.06) translate(-2%,-1%)}  100%{transform:scale(1)    translate(1%,2%)}   }

    /* ── Glitch ────────────────────────────────────────────────────────── */
    .gl { position:relative; display:inline-block; }
    .gl::before,.gl::after { content:attr(data-t); position:absolute; top:0; left:0; width:100%; height:100%; font:inherit; pointer-events:none; }
    .gl::before { color:var(--acc,#c9923a); animation:gl1 7s infinite; clip-path:inset(0 0 100% 0); }
    .gl::after  { color:var(--acc2,#7ecfa0); animation:gl2 7s infinite; clip-path:inset(0 0 100% 0); }
    @keyframes gl1 {
      0%,89%,100%{clip-path:inset(0 0 100% 0);transform:translate(0)}
      90%{clip-path:inset(20% 0 42% 0);transform:translate(-7px,2px)}
      91%{clip-path:inset(58% 0 14% 0);transform:translate(7px,-2px)}
      92%{clip-path:inset(0 0 100% 0);transform:translate(0)}
    }
    @keyframes gl2 {
      0%,84%,100%{clip-path:inset(0 0 100% 0);transform:translate(0)}
      85%{clip-path:inset(44% 0 28% 0);transform:translate(7px,-2px)}
      86%{clip-path:inset(0 0 100% 0);transform:translate(0)}
    }

    /* ── Scroll reveal ─────────────────────────────────────────────────── */
    .rv { opacity:0; transform:translateY(40px); transition:opacity .9s ease,transform .9s cubic-bezier(.22,1,.36,1); }
    .rv.in { opacity:1; transform:translateY(0); }

    /* ── H-scroll ──────────────────────────────────────────────────────── */
    .hscroll { display:flex; overflow-x:auto; gap:14px; padding:0 32px 20px; scroll-snap-type:x mandatory; scrollbar-width:thin; scrollbar-color:var(--acc,#c9923a) transparent; }
    .hscroll::-webkit-scrollbar { height:2px; }
    .hscroll::-webkit-scrollbar-thumb { background:var(--acc,#c9923a); }

    /* ── Marquee / Spin ────────────────────────────────────────────────── */
    @keyframes mq   { from{transform:translateX(0)}    to{transform:translateX(-50%)}  }
    @keyframes spin  { from{transform:rotate(0deg)}    to{transform:rotate(360deg)}    }
    @keyframes spinr { from{transform:rotate(0deg)}    to{transform:rotate(-360deg)}   }

    /* ── Loading screen ────────────────────────────────────────────────── */
    @keyframes lBarFill { from{width:0} to{width:100%} }
    @keyframes lCharIn  { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    /* ── Scroll pulse / iris ──────────────────────────────────────────── */
    @keyframes scrollPulse { 0%,100%{opacity:.45} 50%{opacity:.15} }
    @keyframes irisOut { from{clip-path:circle(150% at 50% 50%)} to{clip-path:circle(0% at 50% 50%)} }
    @keyframes portalSpin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes portalPulse { 0%,100%{opacity:.7} 50%{opacity:1} }

    /* ── Works vertical stack ─────────────────────────────────────────── */
    .work-v { position:relative; height:clamp(260px,55vh,600px); overflow:hidden; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.06); }
    .work-v-img { position:absolute; inset:-10%; width:120%; height:120%; object-fit:cover; transition:transform 1.2s cubic-bezier(.22,1,.36,1); }
    .work-v:hover .work-v-img { transform:scale(1.05); }

    /* ── Project overlay ──────────────────────────────────────────────── */
    .proj-ov-panel { transition:transform .5s cubic-bezier(.16,1,.3,1); }

    /* ── Custom cursor ────────────────────────────────────────────────── */
    .has-cursor, .has-cursor * { cursor:none !important; }
    .cur-ring { position:fixed; border-radius:50%; pointer-events:none; z-index:9999; transition:width .2s,height .2s,border-color .2s,background .2s; will-change:transform; }
    .cur-dot  { position:fixed; border-radius:50%; pointer-events:none; z-index:9999; will-change:transform; }

    /* ── Grain overlay ────────────────────────────────────────────────── */
    .grain-ov { position:fixed; inset:0; pointer-events:none; z-index:9998; }
    .grain-ov svg { position:absolute; width:100%; height:100%; }

    /* ── Tweaks ────────────────────────────────────────────────────────── */
    .tp { position:fixed; bottom:24px; right:24px; z-index:9999; border-radius:4px; padding:20px; width:264px; font-family:'Space Mono',monospace; font-size:11px; }
    .tp label { display:block; font-size:9px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:5px; margin-top:12px; }
    .tp input[type=text] { width:100%; padding:6px 8px; font-family:'Space Mono',monospace; font-size:11px; border-radius:2px; }
    .tp .chips { display:flex; gap:6px; flex-wrap:wrap; }
    .tp .chip { padding:5px 10px; border-radius:2px; cursor:pointer; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.1em; transition:all .2s; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ── Visit seed ─────────────────────────────────────────────────────────── */
const VISIT_SEED = (() => {
  const k = 'mr5am_seed_v4';
  const e = sessionStorage.getItem(k);
  if (e) return parseInt(e);
  const s = Math.floor(Math.random() * 1e8);
  sessionStorage.setItem(k, s);
  return s;
})();

/* ── Random mode — fresh every page load ────────────────────────────────── */
const MODE_KEYS = ['forest', 'azure', 'lotus', 'orbit'];
const INITIAL_MODE = MODE_KEYS[Math.floor(Math.random() * MODE_KEYS.length)];

/* ── Artwork images ──────────────────────────────────────────────────────── */
const ART_IMGS = [
  'assets/image/mr5am_torii_flowers_sun_rays_sun_beams_in_the_style_of_multi-_2fb4ccc6-0778-433b-80f7-a274c8c3e6ae_2.png',
  'assets/image/mr5am_A_painterly_anime_illustration_style_reminiscent_of_Stu_3eaab53c-c771-4d6c-8333-e797aa8bc109_2.png',
  'assets/image/mr5am_A_painterly_anime_illustration_style_reminiscent_of_Stu_9c58bc0e-17e6-4210-86e1-5b6eaccb3a08_2.png',
  'assets/image/mr5am_Dual_scenery_above_and_below_the_water_surface._Above_t_ed2ed109-eb7d-479b-8f01-c558e15189da_2.png',
  'assets/image/mr5am_A_painterly_anime_illustration_style_reminiscent_of_Stu_347cd1e8-cbeb-4074-9730-834b0a65c0ec_3.png',
  'assets/image/mr5am_A_painterly_anime_illustration_style_reminiscent_of_Stu_9c58bc0e-17e6-4210-86e1-5b6eaccb3a08_3.png',
  'assets/image/mr5am_A_painterly_anime_illustration_style_reminiscent_of_Stu_ab2b930c-028a-4c8c-ac70-318cf341d5fc_1.png',
  'assets/image/mr5am_A_painterly_anime_illustration_style_reminiscent_of_Stu_a40f8b1b-9f5f-44f9-a0b2-554d9e817cfd_0.png',
];
ART_IMGS.forEach(s => { const i = new Image(); i.src = s; });

/* ── Mode config ─────────────────────────────────────────────────────────── */
const MODES = {
  forest: { label:'FOREST', darkBg:'#0b1410', lightBg:'#f3ede0', acc:'#b87d2a', acc2:'#6db88a', rgb:[184,125,42]  },
  azure:  { label:'AZURE',  darkBg:'#080f1c', lightBg:'#e8f3fb', acc:'#3d9fc0', acc2:'#e0b840', rgb:[61,159,192]   },
  lotus:  { label:'LOTUS',  darkBg:'#060d0b', lightBg:'#e8f5f1', acc:'#2daa88', acc2:'#d0809a', rgb:[45,170,136]   },
  orbit:  { label:'ORBIT',  darkBg:'#08060f', lightBg:'#f3f0fa', acc:'#a855d4', acc2:'#e8a84a', rgb:[168,85,212]   },
};

/* ── Theme helper ────────────────────────────────────────────────────────── */
const tx = (dark, light, isDark) => isDark ? dark : light;

/* ── Mode-art mapping (artwork indices per world) ───────────────────────── */
const MODE_ART = {
  forest: [0, 4, 5],
  azure:  [1, 3, 6],
  lotus:  [2, 3, 4],
  orbit:  [7, 6, 1],
};

/* ── Works ───────────────────────────────────────────────────────────────── */
const WORKS_RAW = [
  { id:1, title:'Torii Garden',        type:'Generative Art',   year:'2025', tag:'ART',   jp:'鳥居の庭', img:ART_IMGS[0], worlds:['forest','lotus'] },
  { id:2, title:'Below & Above',       type:'Generative Art',   year:'2025', tag:'ART',   jp:'水面',     img:ART_IMGS[3], worlds:['azure','lotus']  },
  { id:3, title:'Threshold',           type:'Anime Short',      year:'2024', tag:'VIDEO', jp:'閾値',     img:ART_IMGS[4], worlds:['forest','lotus'] },
  { id:4, title:'Azure City',          type:'Generative Art',   year:'2024', tag:'ART',   jp:'蒼天',     img:ART_IMGS[1], worlds:['azure','orbit']  },
  { id:5, title:'Moving Architecture', type:'Generative Art',   year:'2024', tag:'ART',   jp:'動く城',   img:ART_IMGS[2], worlds:['orbit','azure']  },
  { id:6, title:'Reclaimed',           type:'Generative Art',   year:'2023', tag:'ART',   jp:'自然回帰', img:ART_IMGS[5], worlds:['forest','lotus'] },
  { id:7, title:'Pulse Engine',        type:'Generative Music', year:'2023', tag:'MUSIC', jp:'脈動',     img:null,        worlds:['orbit','azure']  },
  { id:8, title:'From Orbit',          type:'Generative Art',   year:'2025', tag:'ART',   jp:'軌道から', img:ART_IMGS[6], worlds:['orbit']          },
  { id:9, title:'E.V.A.',              type:'Generative Art',   year:'2025', tag:'ART',   jp:'船外活動', img:ART_IMGS[7], worlds:['orbit']          },
];
const WORKS = [...WORKS_RAW].sort((a,b) =>
  Math.sin(VISIT_SEED*a.id*9301+49297) - Math.sin(VISIT_SEED*b.id*9301+49297)
);

const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "name": "mr5am",
  "tagline": "generative art · anime · music · games",
  "mode": "forest"
}/*EDITMODE-END*/;

/* ── useReveal ───────────────────────────────────────────────────────────── */
function useReveal(m = '-60px') {
  const ref = useRef();
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { el.classList.add('in'); obs.disconnect(); }
    }, { rootMargin: m });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}

/* ── Loading Screen ──────────────────────────────────────────────────────── */
function LoadingScreen({ mode, isDark, onDone }) {
  const cfg = MODES[mode];
  const bg = isDark ? cfg.darkBg : cfg.lightBg;
  const fg = isDark ? '#f0ece4' : '#1a1a1a';
  const fg2 = isDark ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.4)';
  const [phase, setPhase] = useState(0); // 0=in 1=hold 2=out
  const name = 'MR5AM';

  useEffect(() => {
    const t1 = setTimeout(() => setPhase(1), 300);
    const t2 = setTimeout(() => setPhase(2), 2600);
    const t3 = setTimeout(onDone, 3400);
    return () => [t1,t2,t3].forEach(clearTimeout);
  }, []);

  return (
    <div style={{
      position:'fixed', inset:0, zIndex:2000,
      background: bg,
      display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
      clipPath: phase === 2 ? 'circle(0% at 50% 50%)' : 'circle(150% at 50% 50%)',
      transition: phase === 2 ? 'clip-path 0.85s cubic-bezier(.77,0,.18,1)' : 'none',
      pointerEvents: phase === 2 ? 'none' : 'all',
    }}>
      {/* Artwork peek — very faint */}
      <div style={{
        position:'absolute', inset:0, overflow:'hidden',
        opacity: phase >= 1 ? (isDark ? 0.12 : 0.18) : 0,
        transition:'opacity 1.2s ease 0.4s',
      }}>
        <img src={ART_IMGS[VISIT_SEED % ART_IMGS.length]} alt="" style={{ width:'100%', height:'100%', objectFit:'cover', filter:'blur(2px)' }} />
      </div>
      {/* Vignette */}
      <div style={{ position:'absolute', inset:0, background:`radial-gradient(ellipse 70% 70% at 50% 50%, transparent 30%, ${bg} 80%)` }} />

      <div style={{ position:'relative', zIndex:1, textAlign:'center' }}>
        {/* Character-by-character title */}
        <div style={{ fontFamily:'Bebas Neue', fontSize:'clamp(64px,12vw,160px)', lineHeight:.9, letterSpacing:'.06em', color:fg, display:'flex', justifyContent:'center' }}>
          {name.split('').map((ch, i) => (
            <span key={i} style={{
              display:'inline-block',
              opacity: phase >= 1 ? 1 : 0,
              transform: phase >= 1 ? 'none' : 'translateY(20px)',
              transition: `opacity 0.5s ease ${0.08 + i*0.06}s, transform 0.6s cubic-bezier(.22,1,.36,1) ${0.08 + i*0.06}s`,
            }}>{ch}</span>
          ))}
        </div>

        {/* Progress bar */}
        <div style={{ margin:'24px auto 0', width:200, height:1, background: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)', position:'relative', overflow:'hidden' }}>
          <div style={{
            position:'absolute', top:0, left:0, height:'100%', background:cfg.acc,
            width: phase >= 1 ? '100%' : '0%',
            transition:'width 1.8s cubic-bezier(.22,1,.36,1) 0.3s',
            boxShadow:`0 0 8px ${cfg.acc}`,
          }} />
        </div>

        {/* JP tagline */}
        <div style={{
          fontFamily:'Noto Sans JP', fontWeight:700, fontSize:12, color: cfg.acc,
          letterSpacing:'.15em', marginTop:20,
          opacity: phase >= 1 ? 1 : 0,
          transition:'opacity 0.8s ease 0.8s',
        }}>
          創造と芸術の世界へ
        </div>

        {/* Mode indicator */}
        <div style={{
          fontFamily:'Space Mono', fontSize:9, color:fg2, letterSpacing:'.2em',
          textTransform:'uppercase', marginTop:10,
          opacity: phase >= 1 ? 0.6 : 0,
          transition:'opacity 0.8s ease 1s',
        }}>
          ENTERING {cfg.label} · {isDark ? 'NIGHT' : 'DAY'}
        </div>
      </div>
    </div>
  );
}

/* ── Artwork Slideshow BG ────────────────────────────────────────────────── */
function ArtworkSlideshowBG({ mode, isDark }) {
  const cfg = MODES[mode];
  const modeImgs = MODE_ART[mode];
  const startIdx = VISIT_SEED % modeImgs.length;
  const [active, setActive] = useState(0);
  const [slots, setSlots] = useState([
    { img: modeImgs[startIdx], animKey: 0 },
    { img: modeImgs[(startIdx + 1) % modeImgs.length], animKey: 1 },
  ]);
  const nextRef = useRef((startIdx + 2) % modeImgs.length);

  useEffect(() => {
    const imgs = MODE_ART[mode];
    const start = VISIT_SEED % imgs.length;
    setActive(0);
    setSlots([
      { img: imgs[start], animKey: Date.now() },
      { img: imgs[(start + 1) % imgs.length], animKey: Date.now() + 1 },
    ]);
    nextRef.current = (start + 2) % imgs.length;
  }, [mode]);

  useEffect(() => {
    const iv = setInterval(() => {
      const imgs = MODE_ART[mode];
      setActive(a => {
        const incoming = (a + 1) % 2;
        const newImgIdx = nextRef.current;
        nextRef.current = (newImgIdx + 1) % imgs.length;
        setSlots(s => s.map((sl, i) => i === incoming ? { img: imgs[newImgIdx], animKey: sl.animKey + 2 } : sl));
        return incoming;
      });
    }, 9000);
    return () => clearInterval(iv);
  }, [mode]);

  const overlayAlpha = isDark ? 0.32 : 0.18;

  return (
    <div style={{ position:'fixed', inset:0, zIndex:0, overflow:'hidden', background:'#000' }}>
      {slots.map((sl, i) => (
        <div key={sl.animKey} style={{
          position:'absolute', inset:0,
          opacity: i === active ? 1 : 0,
          transition:'opacity 2.4s ease',
          zIndex: i === active ? 2 : 1,
        }}>
          <img src={ART_IMGS[sl.img]} alt="" style={{
            width:'100%', height:'100%', objectFit:'cover', display:'block',
            animation:`kb${sl.img % 6} 18s ease-in-out both`,
            filter: isDark ? 'brightness(0.92)' : 'brightness(1.05) saturate(0.95)',
          }} />
        </div>
      ))}
      <div style={{ position:'absolute', inset:0, zIndex:3, background:`rgba(0,0,0,${overlayAlpha})`, transition:'background 1s ease' }} />
      <div style={{ position:'absolute', inset:0, zIndex:4, background:'linear-gradient(180deg,rgba(0,0,0,0.18) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0.4) 75%,rgba(0,0,0,0.75) 100%)', pointerEvents:'none' }} />
      <div style={{ position:'absolute', inset:0, zIndex:5, background:`radial-gradient(ellipse 80% 60% at 70% 40%, ${cfg.acc}15, transparent 65%)`, transition:'background 1.5s ease', pointerEvents:'none' }} />
    </div>
  );
}

/* ── Weather Canvas (8 world atmospheres) ────────────────────────────────── */
function WeatherCanvas({ mode, isDark }) {
  const canvasRef = useRef();
  const rafRef = useRef();
  const stRef = useRef({ mode, isDark, particles: [], t: 0 });
  const isMobile = navigator.maxTouchPoints > 0;

  useEffect(() => {
    stRef.current.mode = mode;
    stRef.current.isDark = isDark;
    stRef.current.particles = [];
  }, [mode, isDark]);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    let W, H;
    const resize = () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; };
    resize();
    window.addEventListener('resize', resize);

    const MAX = isMobile ? 28 : 55;

    const mkParticle = (ox, oy) => {
      const { mode: m, isDark: dk } = stRef.current;
      const t = `${m}_${dk ? 'n' : 'd'}`;
      const rx = ox !== undefined ? ox : Math.random() * W;
      const ry = oy !== undefined ? oy : Math.random() * H;
      if (t === 'forest_d') return { t, x:rx, y:ry<0?-20:ry, vx:(Math.random()-.5)*.8, vy:Math.random()*.6+.3, sz:Math.random()*4+2, rot:Math.random()*Math.PI*2, rv:(Math.random()-.5)*.06, ph:Math.random()*Math.PI*2 };
      if (t === 'forest_n') return { t, x:rx, y:ry, vx:(Math.random()-.5)*.22, vy:-(Math.random()*.18+.04), r:Math.random()*2.2+.8, ph:Math.random()*Math.PI*2, fr:Math.random()*.4+.2, sz:Math.random()*14+6 };
      if (t === 'azure_d')  return { t, x:rx<0?Math.random()*W*1.5:rx, y:ry<0?-10:ry, vx:-1.2, vy:8+Math.random()*4, len:Math.random()*12+8, al:Math.random()*.25+.08 };
      if (t === 'azure_n')  return { t, x:rx, y:ry<0?-10:ry, vx:(Math.random()-.5)*.3, vy:.5+Math.random()*.5, sz:Math.random()*3+1.5, ph:Math.random()*Math.PI*2, fr:Math.random()*.3+.1, al:Math.random()*.5+.2 };
      if (t === 'lotus_d')  return { t, x:rx, y:ry>H?H+20:ry, vx:(Math.random()-.5)*.6+.2, vy:-(Math.random()*.5+.2), sz:Math.random()*5+3, rot:Math.random()*Math.PI*2, rv:(Math.random()-.5)*.04, ph:Math.random()*Math.PI*2, al:Math.random()*.6+.3 };
      if (t === 'lotus_n')  return { t, x:rx, y:ry>H?H+20:ry, vx:(Math.random()-.5)*.4, vy:-(Math.random()*.8+.4), sz:Math.random()*6+4, ph:Math.random()*Math.PI*2, fr:Math.random()*.2+.1, al:Math.random()*.55+.3 };
      if (t === 'orbit_d')  return { t, x:rx, y:ry, vx:3+Math.random()*4, vy:-.5+Math.random(), len:Math.random()*40+20, al:Math.random()*.55+.2 };
      if (t === 'orbit_n')  return Math.random()<.88
        ? { t, isStar:true,  x:rx, y:ry, sz:Math.random()*1.4+.3, ph:Math.random()*Math.PI*2, fr:Math.random()*.5+.1 }
        : { t, isStar:false, x:rx, y:ry<0?Math.random()*H*.4:ry, vx:-2-Math.random()*3, vy:.5+Math.random(), len:Math.random()*60+30, al:Math.random()*.6+.3 };
      return null;
    };

    const spawnBurst = (bx, by, n = 10) => {
      for (let i = 0; i < n; i++) {
        const p = mkParticle(bx, by);
        if (!p) continue;
        const ang = (i / n) * Math.PI * 2;
        const spd = 1.5 + Math.random() * 3;
        p.vx = Math.cos(ang) * spd; p.vy = Math.sin(ang) * spd;
        p.burst = true;
        stRef.current.particles.push(p);
      }
    };

    const onInteract = e => {
      const el = e.target;
      if (el.tagName === 'BUTTON' || el.tagName === 'A' || el.tagName === 'INPUT') return;
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      spawnBurst(cx, cy);
    };
    document.addEventListener('click', onInteract);
    document.addEventListener('touchstart', onInteract, { passive: true });

    const fill = (n = MAX) => {
      const ps = stRef.current.particles;
      while (ps.length < n) {
        const p = mkParticle();
        if (p) ps.push(p);
      }
    };
    fill();

    let ti = 0;
    const loop = () => {
      ti += 0.012;
      ctx.clearRect(0, 0, W, H);
      const { mode: m, isDark: dk, particles: ps } = stRef.current;
      const cfg = MODES[m];
      const [pr, pg, pb] = cfg.rgb;
      const wt = `${m}_${dk ? 'n' : 'd'}`;

      if (ps.length < MAX) { const p = mkParticle(); if (p) ps.push(p); }

      for (let i = ps.length - 1; i >= 0; i--) {
        const p = ps[i];
        if (p.t !== wt) { ps.splice(i, 1); continue; }

        if (wt === 'forest_d') {
          p.x += p.vx + Math.sin(ti + p.ph) * .3; p.y += p.vy; p.rot += p.rv;
          if (p.burst) { p.vx *= .94; p.vy *= .94; }
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.globalAlpha = p.al || .55;
          ctx.fillStyle = 'rgba(249,213,229,1)';
          ctx.beginPath(); ctx.ellipse(0, 0, p.sz, p.sz * .6, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          if (p.y > H + 30) ps.splice(i, 1);

        } else if (wt === 'forest_n') {
          p.x += p.vx + Math.sin(ti*.3+p.ph)*.08; p.y += p.vy + Math.cos(ti*.25+p.ph*1.3)*.06;
          p.vx += (Math.random()-.5)*.008; p.vy += (Math.random()-.5)*.006;
          p.vx *= .996; p.vy *= .996;
          if (p.x<-40)p.x=W+40; if(p.x>W+40)p.x=-40;
          if (p.y<-80)p.y=H+40; if(p.y>H+40)p.y=-20;
          const al = (Math.sin(ti*p.fr+p.ph)*.5+.5)*.55+.08;
          const g1 = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.sz*2);
          g1.addColorStop(0,`rgba(${pr},${pg},${pb},${al*.55})`);
          g1.addColorStop(.4,`rgba(${pr},${pg},${pb},${al*.18})`);
          g1.addColorStop(1,`rgba(${pr},${pg},${pb},0)`);
          ctx.beginPath(); ctx.fillStyle=g1; ctx.arc(p.x,p.y,p.sz*2,0,Math.PI*2); ctx.fill();
          const g2 = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*1.8);
          g2.addColorStop(0,`rgba(255,255,240,${al*.9})`);
          g2.addColorStop(1,`rgba(${pr},${pg},${pb},0)`);
          ctx.beginPath(); ctx.fillStyle=g2; ctx.arc(p.x,p.y,p.r*1.8,0,Math.PI*2); ctx.fill();

        } else if (wt === 'azure_d') {
          p.x += p.vx; p.y += p.vy;
          ctx.save(); ctx.globalAlpha = p.al;
          ctx.strokeStyle = 'rgba(168,216,234,1)'; ctx.lineWidth = .7;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * (p.len / p.vy), p.y - p.len); ctx.stroke();
          ctx.restore();
          if (p.y > H + 30) ps.splice(i, 1);

        } else if (wt === 'azure_n') {
          p.x += p.vx + Math.sin(ti+p.ph)*.15; p.y += p.vy;
          const aa = (Math.sin(ti*p.fr+p.ph)*.4+.6)*p.al;
          const ag = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.sz*4);
          ag.addColorStop(0,`rgba(61,159,192,${aa*.8})`); ag.addColorStop(1,`rgba(61,159,192,0)`);
          ctx.beginPath(); ctx.fillStyle=ag; ctx.arc(p.x,p.y,p.sz*4,0,Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.fillStyle=`rgba(140,230,255,${aa})`; ctx.arc(p.x,p.y,p.sz*.5,0,Math.PI*2); ctx.fill();
          if (p.y > H + 30) ps.splice(i, 1);

        } else if (wt === 'lotus_d') {
          p.x += p.vx + Math.sin(ti+p.ph)*.3; p.y += p.vy; p.rot += p.rv;
          if (p.burst) { p.vx *= .94; p.vy *= .94; }
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.globalAlpha = p.al;
          ctx.fillStyle = 'rgba(208,128,154,1)';
          ctx.beginPath(); ctx.ellipse(0, 0, p.sz, p.sz * .6, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          if (p.y < -30) ps.splice(i, 1);

        } else if (wt === 'lotus_n') {
          p.x += p.vx + Math.sin(ti*.4+p.ph)*.2; p.y += p.vy;
          const la = (Math.sin(ti*p.fr+p.ph)*.3+.7)*p.al;
          const lg = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.sz*3);
          lg.addColorStop(0,`rgba(232,168,74,${la})`); lg.addColorStop(.4,`rgba(232,168,74,${la*.4})`); lg.addColorStop(1,`rgba(232,168,74,0)`);
          ctx.beginPath(); ctx.fillStyle=lg; ctx.arc(p.x,p.y,p.sz*3,0,Math.PI*2); ctx.fill();
          ctx.save(); ctx.globalAlpha=la*.8; ctx.fillStyle='rgb(232,168,74)';
          ctx.beginPath(); ctx.ellipse(p.x,p.y,p.sz*.6,p.sz,0,0,Math.PI*2); ctx.fill(); ctx.restore();
          if (p.y < -40) ps.splice(i, 1);

        } else if (wt === 'orbit_d') {
          p.x += p.vx; p.y += p.vy;
          const og = ctx.createLinearGradient(p.x,p.y,p.x-p.len,p.y-(p.vy/Math.max(p.vx,.1))*p.len);
          og.addColorStop(0,'rgba(255,220,100,.8)'); og.addColorStop(1,'rgba(255,220,100,0)');
          ctx.save(); ctx.globalAlpha=p.al*(1-p.x/W*.5);
          ctx.strokeStyle=og; ctx.lineWidth=1.5;
          ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.len,p.y-(p.vy/Math.max(p.vx,.1))*p.len); ctx.stroke();
          ctx.restore();
          if (p.x > W + 60) ps.splice(i, 1);

        } else if (wt === 'orbit_n') {
          if (p.isStar) {
            const sa = (Math.sin(ti*p.fr+p.ph)*.4+.6)*.7;
            ctx.beginPath(); ctx.fillStyle=`rgba(255,255,255,${sa})`; ctx.arc(p.x,p.y,p.sz,0,Math.PI*2); ctx.fill();
          } else {
            p.x += p.vx; p.y += p.vy;
            const sg = ctx.createLinearGradient(p.x,p.y,p.x-p.len,p.y-p.vy*(p.len/Math.abs(p.vx)));
            sg.addColorStop(0,`rgba(200,150,255,${p.al})`); sg.addColorStop(1,'rgba(200,150,255,0)');
            ctx.strokeStyle=sg; ctx.lineWidth=1.5;
            ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.len,p.y-p.vy*(p.len/Math.abs(p.vx))); ctx.stroke();
            if (p.x < -60) ps.splice(i, 1);
          }
        }
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    loop();

    return () => {
      window.removeEventListener('resize', resize);
      cancelAnimationFrame(rafRef.current);
      document.removeEventListener('click', onInteract);
      document.removeEventListener('touchstart', onInteract);
    };
  }, []);

  return <canvas ref={canvasRef} style={{ position:'fixed', inset:0, zIndex:6, pointerEvents:'none' }} />;
}

/* ── Portal Canvas ───────────────────────────────────────────────────────── */
function PortalCanvas({ targetMode, onMidpoint, onComplete }) {
  const ref = useRef();
  useEffect(() => {
    if (!targetMode) return;
    const canvas = ref.current;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = window.innerWidth;
    const H = canvas.height = window.innerHeight;
    const cx = W / 2, cy = H / 2;
    const cfg = MODES[targetMode];
    const [pr, pg, pb] = cfg.rgb;
    const TOTAL = 80, MID = 38;
    let frame = 0, raf;
    const pts = Array.from({ length: 90 }, (_, i) => ({
      ang: (i / 90) * Math.PI * 2 + Math.random() * .2,
      rad: 60 + Math.random() * 220,
      spd: .04 + Math.random() * .06,
      sz: Math.random() * 3 + 1,
    }));
    const animate = () => {
      ctx.clearRect(0, 0, W, H);
      const prog = frame / TOTAL;
      const bgA = Math.min(prog * 4, 1) * .92;
      ctx.fillStyle = `rgba(0,0,0,${bgA})`;
      ctx.fillRect(0, 0, W, H);
      const pull = frame < MID ? frame / MID : 1;
      pts.forEach(p => {
        p.ang += p.spd * (1 + prog);
        const r = p.rad * (1 - pull * .75) + 5;
        const x = cx + Math.cos(p.ang) * r;
        const y = cy + Math.sin(p.ang) * r;
        const a = (.5 + .5 * Math.sin(p.ang)) * bgA;
        ctx.beginPath();
        ctx.fillStyle = `rgba(${pr},${pg},${pb},${a})`;
        ctx.arc(x, y, p.sz, 0, Math.PI * 2);
        ctx.fill();
      });
      const glowR = (frame < MID ? (frame / MID) : (1 + (frame - MID) / (TOTAL - MID) * 3)) * Math.min(W, H) * .35;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
      g.addColorStop(0, `rgba(${pr},${pg},${pb},${.7 * bgA})`);
      g.addColorStop(.35, `rgba(${pr},${pg},${pb},${.25 * bgA})`);
      g.addColorStop(1, `rgba(${pr},${pg},${pb},0)`);
      ctx.beginPath(); ctx.fillStyle = g; ctx.arc(cx, cy, glowR, 0, Math.PI * 2); ctx.fill();
      if (frame === MID) onMidpoint();
      frame++;
      if (frame < TOTAL) { raf = requestAnimationFrame(animate); } else { onComplete(); }
    };
    animate();
    return () => cancelAnimationFrame(raf);
  }, [targetMode]);

  if (!targetMode) return null;
  return <canvas ref={ref} style={{ position:'fixed', inset:0, zIndex:9000, pointerEvents:'all' }} />;
}

/* ── Custom Cursor ───────────────────────────────────────────────────────── */
function CustomCursor({ mode }) {
  const ringRef = useRef();
  const dotRef = useRef();
  const pos = useRef({ x:-200, y:-200, tx:-200, ty:-200, link:false });
  const modeRef = useRef(mode);
  useEffect(() => { modeRef.current = mode; }, [mode]);

  useEffect(() => {
    if (navigator.maxTouchPoints > 0) return;
    document.documentElement.classList.add('has-cursor');
    const onMove = e => { pos.current.tx = e.clientX; pos.current.ty = e.clientY; };
    const onOver = e => {
      const tag = e.target.tagName;
      pos.current.link = tag === 'A' || tag === 'BUTTON' || !!e.target.closest('a,button,[data-cursor]');
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseover', onOver);
    let raf;
    const tick = () => {
      const p = pos.current;
      p.x += (p.tx - p.x) * .12;
      p.y += (p.ty - p.y) * .12;
      const cfg = MODES[modeRef.current];
      const ring = ringRef.current, dot = dotRef.current;
      if (ring && dot) {
        ring.style.transform = `translate(${p.x}px,${p.y}px) translate(-50%,-50%)`;
        dot.style.transform = `translate(${p.tx}px,${p.ty}px) translate(-50%,-50%)`;
        ring.style.width  = p.link ? '44px' : '22px';
        ring.style.height = p.link ? '44px' : '22px';
        ring.style.borderColor = p.link ? cfg.acc : `${cfg.acc}55`;
        ring.style.background  = p.link ? `${cfg.acc}20` : 'transparent';
        dot.style.background = cfg.acc;
      }
      raf = requestAnimationFrame(tick);
    };
    tick();
    return () => {
      document.documentElement.classList.remove('has-cursor');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseover', onOver);
      cancelAnimationFrame(raf);
    };
  }, []);

  if (navigator.maxTouchPoints > 0) return null;
  return (
    <>
      <div ref={ringRef} className="cur-ring" style={{ width:22, height:22, border:`1.5px solid rgba(255,255,255,.4)` }} />
      <div ref={dotRef}  className="cur-dot"  style={{ width:4, height:4, background:'#fff' }} />
    </>
  );
}

/* ── Nav ─────────────────────────────────────────────────────────────────── */
function Nav({ name, mode, onPortal, isDark, setIsDark }) {

    const fn = () => setSc(window.scrollY > 50);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);

  const navBg = sc ? (isDark ? `${cfg.darkBg}f0` : `${cfg.lightBg}f0`) : 'transparent';
  const textFade = isDark ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.3)';
  const linkColor = isDark ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.4)';

  return (
    <nav style={{
      position:'fixed', top:0, left:0, right:0, zIndex:100,
      padding:'14px 32px', display:'flex', alignItems:'center', justifyContent:'space-between',

      borderBottom:`1px solid ${sc ? cfg.acc+'28' : 'transparent'}`, transition:'all .4s',
    }}>
      <span style={{ fontFamily:'Space Mono', fontSize:11, color:cfg.acc, letterSpacing:'.14em' }}>
        {name}<span style={{ color: textFade }}> / {new Date().getFullYear()}</span>
      </span>

      <div style={{ display:'flex', gap:10, alignItems:'center' }}>
        {Object.entries(MODES).map(([k, m]) => {
          const isActive = mode === k;
          const isHov = hovOrb === k;
          return (
            <div key={k} style={{ position:'relative', display:'flex', alignItems:'center' }}>
              <button
                onClick={() => k !== mode && onPortal(k)}
                onMouseEnter={() => setHovOrb(k)}
                onMouseLeave={() => setHovOrb(null)}
                title={m.label}
                style={{
                  width: isActive ? 30 : 22, height: isActive ? 30 : 22,
                  borderRadius:'50%', cursor: k === mode ? 'default' : 'pointer',
                  border:`2px solid ${isActive ? m.acc : (isHov ? m.acc+'88' : (isDark?'rgba(255,255,255,0.12)':'rgba(0,0,0,0.14)'))}`,
                  background: isActive ? m.acc : (isHov ? `${m.acc}28` : `${m.acc}12`),
                  boxShadow: isActive ? `0 0 14px ${m.acc}88, 0 0 5px ${m.acc}` : (isHov ? `0 0 8px ${m.acc}44` : 'none'),
                  transition:'all .25s cubic-bezier(.22,1,.36,1)', padding:0,
                }}
              />
              {(isHov || isActive) && (
                <span style={{
                  position:'absolute', top:'calc(100% + 7px)', left:'50%', transform:'translateX(-50%)',
                  fontFamily:'Space Mono', fontSize:7, letterSpacing:'.12em', color:m.acc,
                  whiteSpace:'nowrap', pointerEvents:'none', opacity: isHov || isActive ? 1 : 0,
                  transition:'opacity .15s',
                }}>{m.label}</span>
              )}
            </div>
          );
        })}
        {/* Day/Night toggle */}
        <button onClick={() => setIsDark(d => !d)} title={isDark ? 'Day mode' : 'Night mode'} style={{
          marginLeft:4, width:28, height:28, borderRadius:'50%', cursor:'pointer', border:`1px solid ${cfg.acc}44`,
          background: isDark ? cfg.acc+'18' : cfg.acc+'22',
          color: cfg.acc, fontSize:13, display:'flex', alignItems:'center', justifyContent:'center',
          transition:'all .25s',
        }}>
          {isDark ? '☀' : '☾'}
        </button>
      </div>

      <div style={{ display:'flex', gap:28 }}>
        {['work','about','contact'].map(s => (
          <a key={s} href={`#${s}`} style={{
            fontFamily:'Space Mono', fontSize:9, letterSpacing:'.14em', textTransform:'uppercase',
            color: linkColor, textDecoration:'none', transition:'color .2s',
          }}
          onMouseEnter={e => e.target.style.color = cfg.acc}
          onMouseLeave={e => e.target.style.color = linkColor}
          >{s}</a>
        ))}
      </div>
    </nav>
  );
}

/* ── Stats Bar ───────────────────────────────────────────────────────────── */
function StatsBar({ mode, isDark }) {
  const cfg = MODES[mode];
  const ref = useRef();
  const [counts, setCounts] = useState([0,0,0,0]);
  const targets = [9, 5, 4, 6];
  const stats = [
    { label:'PROJECTS',    jp:'作品', suffix:'' },
    { label:'YEARS',       jp:'年間', suffix:'+' },
    { label:'MEDIUMS',     jp:'表現', suffix:'' },
    { label:'EXPERIMENTS', jp:'実験', suffix:'' },
  ];
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting) return;
      obs.disconnect();
      targets.forEach((tgt, i) => {
        const dur = 1200, start = Date.now();
        const tick = () => {
          const p = Math.min((Date.now()-start)/dur, 1);
          const eased = 1 - Math.pow(1-p, 3);
          setCounts(c => { const n=[...c]; n[i]=Math.round(eased*tgt); return n; });
          if (p < 1) requestAnimationFrame(tick);
        };
        setTimeout(() => requestAnimationFrame(tick), i * 130);
      });
    }, { rootMargin:'-40px' });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  const border = `1px solid ${cfg.acc}20`;
  return (
    <div ref={ref} style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', borderTop:border, borderBottom:border, background:`rgba(${cfg.rgb.join(',')},0.04)` }}>
      {stats.map((s,i) => (
        <div key={i} style={{ padding:'28px 20px', textAlign:'center', borderRight:i<3?border:'none' }}>
          <div style={{ fontFamily:'Bebas Neue', fontSize:'clamp(44px,7vw,80px)', color:cfg.acc, lineHeight:1, letterSpacing:'.02em' }}>{counts[i]}{s.suffix}</div>
          <div style={{ fontFamily:'Space Mono', fontSize:8, color:tx('rgba(255,255,255,0.28)','rgba(0,0,0,0.38)',isDark), letterSpacing:'.18em', textTransform:'uppercase', marginTop:4 }}>{s.label}</div>
          <div style={{ fontFamily:'Noto Sans JP', fontWeight:700, fontSize:10, color:`${cfg.acc}44`, marginTop:3 }}>{s.jp}</div>
        </div>
      ))}
    </div>
  );
}

      <input type="text" value={tweaks.name} onChange={e => upd('name',e.target.value)} style={{ background:inputBg, border:`1px solid ${inputBorder}`, color:inputColor }} />
      <label style={{ color:labelColor }}>Visual Mode</label>
      <div className="chips">
        {Object.entries(MODES).map(([k,m]) => (
          <button key={k} className={`chip${mode===k?' on':''}`}
            style={{ border:`1px solid ${mode===k?m.acc:chipBorder}`, background:mode===k?m.acc+'22':'transparent', color:mode===k?m.acc:chipColor }}
            onClick={() => { setMode(k); upd('mode',k); }}>{m.label}</button>
        ))}
      </div>
      <label style={{ color:labelColor }}>Appearance</label>
      <div className="chips">
        {[['dark','DARK',true],['light','LIGHT',false]].map(([k,lbl,val]) => (
          <button key={k} className={`chip${isDark===val?' on':''}`}
            style={{ border:`1px solid ${isDark===val?cfg.acc:chipBorder}`, background:isDark===val?cfg.acc+'22':'transparent', color:isDark===val?cfg.acc:chipColor }}
            onClick={() => setIsDark(val)}>{lbl}</button>
        ))}
      </div>
    </div>
  );
}

/* ── App ─────────────────────────────────────────────────────────────────── */
function App() {
  const [loading, setLoading] = useState(true);
  const [tweaks, setTweaks] = useState(TWEAKS_DEFAULTS);
  const [mode, setMode] = useState(INITIAL_MODE);
  const [isDark, setIsDark] = useState(true);
  const [tweaksOn, setTweaksOn] = useState(false);
  const [portalTarget, setPortalTarget] = useState(null);

  const triggerPortal = (newMode) => {
    if (portalTarget || newMode === mode) return;
    setPortalTarget(newMode);
  };

  useEffect(() => {
    const handler = e => {
      if (e.data?.type === '__activate_edit_mode')   setTweaksOn(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOn(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return () => window.removeEventListener('message', handler);
  }, []);

  useEffect(() => {
    const cfg = MODES[mode];
    const bg = isDark ? cfg.darkBg : cfg.lightBg;
    document.documentElement.style.setProperty('--acc', cfg.acc);
    document.documentElement.style.setProperty('--acc2', cfg.acc2);
    document.documentElement.style.setProperty('--bg', bg);
    document.body.style.background = bg;
    document.documentElement.style.background = bg;
    document.documentElement.style.color = isDark ? '#f0ece4' : '#1a1a1a';
  }, [mode, isDark]);

  const { name } = tweaks;

  return (
    <>
      {loading && <LoadingScreen mode={mode} isDark={isDark} onDone={() => setLoading(false)} />}

      <ArtworkSlideshowBG mode={mode} isDark={isDark} />
      <WeatherCanvas mode={mode} isDark={isDark} />
      <GrainOverlay isDark={isDark} />
      <CustomCursor mode={mode} />

      <PortalCanvas
        targetMode={portalTarget}
        onMidpoint={() => { if (portalTarget) setMode(portalTarget); }}
        onComplete={() => setPortalTarget(null)}
      />

      <div style={{ position:'relative', zIndex:7 }}>
        <Nav name={name} mode={mode} onPortal={triggerPortal} isDark={isDark} setIsDark={setIsDark} />
        <Hero name={name} mode={mode} isDark={isDark} />
      </div>

      <ContentBG mode={mode} isDark={isDark}>
        <StatsBar mode={mode} isDark={isDark} />
        <WorksSection mode={mode} isDark={isDark} />
        <AboutSection name={name} mode={mode} isDark={isDark} />
        <ProcessSection mode={mode} isDark={isDark} />
        <ExperimentsSection mode={mode} isDark={isDark} />
        <ContactSection name={name} mode={mode} isDark={isDark} />
        <Footer name={name} mode={mode} isDark={isDark} />
      </ContentBG>

      <TweaksPanel visible={tweaksOn} tweaks={tweaks} setTweaks={setTweaks}
        mode={mode} setMode={setMode} isDark={isDark} setIsDark={setIsDark} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
